name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew build --no-daemon
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: build/reports/tests/

  # The built jar on a real broker, one job per supported release. The job
  # names are what the ruleset requires; keep them stable.
  integration:
    name: integration (${{ matrix.kafka }})
    needs: check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        kafka: ["4.1.2", "4.2.2", "4.3.1"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew integrationTest -PbrokerVersion=${{ matrix.kafka }} --no-daemon
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: integration-reports-${{ matrix.kafka }}
          path: build/reports/tests/
